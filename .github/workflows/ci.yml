name: CI

on:
  push:
    branches:
      - main
      - bootstrap/path-foundation
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-package-lock
          path: package-lock.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
